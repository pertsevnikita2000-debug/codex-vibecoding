    <text x="619" y="418" fill="#B5BDD0" font-size="20" font-family="Inter, Arial, sans-serif">Direct flash + RGB</text>
    <text x="619" y="446" fill="#B5BDD0" font-size="20" font-family="Inter, Arial, sans-serif">фиолетовый/циан.</text>
