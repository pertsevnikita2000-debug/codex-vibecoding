    </linearGradient>
  </defs>

  <rect width="1200" height="760" fill="url(#bg)"/>
  <rect x="70" y="54" width="1060" height="260" rx="28" fill="url(#hero)" stroke="#FFFFFF22"/>

  <text x="110" y="145" fill="#F5F7FB" font-size="58" font-family="Inter, Arial, sans-serif" font-weight="700">
    Современная стильная фотосессия
  </text>
  <text x="110" y="188" fill="#B5BDD0" font-size="24" font-family="Inter, Arial, sans-serif">
    luxury street + editorial mood + night city
  </text>

